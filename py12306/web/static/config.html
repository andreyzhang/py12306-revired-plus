<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>py12306 配置中心（新版）</title><style>body{margin:0;padding:28px;background:#edf4f5;color:#203746;font:15px Arial,"Microsoft YaHei"}main{max-width:980px;margin:auto;background:#ffffffdd;padding:30px;border-radius:18px;box-shadow:0 15px 50px #496b7622}h1{color:#287c9b}h2{border-top:1px solid #d5e1e4;padding-top:20px}label{display:block;margin:14px 0;color:#607887}small{display:block;margin:4px 0;color:#8498a0}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c7d6da;border-radius:8px;background:#f8fbfb;font:inherit}button{margin-top:18px;padding:11px 20px;border:0;border-radius:8px;background:#287c9b;color:white;font-weight:bold;cursor:pointer}.advanced{display:none}.toggle{background:#eef5f6;color:#287c9b;border:1px solid #c7d6da}.err{color:#b33}.ok{color:#287c9b}</style><main><h1>配置中心 <small style="font-size:12px;color:#8498a0">新版向导</small></h1><p id="msg">正在读取配置…</p><section><h2>12306 账号</h2><label>用户名<small>你的 12306 登录账号</small><input id="user"></label><label>密码<small>扫码登录可以留空</small><input id="pwd" type="password"></label><label>登录方式<select id="login"><option value="qr">扫码登录（推荐）</option><option value="">密码登录</option></select></label></section><section><h2>购票任务</h2><label>出发站<input id="left" placeholder="例如：北京"></label><label>到达站<input id="arrive" placeholder="例如：上海"></label><label>出发日期<small>格式 YYYY-MM-DD，多个日期用逗号分隔</small><input id="dates" placeholder="2026-10-01"></label><label>乘客姓名<small>多个乘客用逗号分隔</small><input id="members" placeholder="张三"></label><label>座席<small>例如：二等座,硬卧</small><input id="seats" placeholder="二等座"></label><label>车次<small>留空表示接受所有车次</small><input id="trains" placeholder="G1,G2"></label></section><section><h2>查询和通知</h2><label>查询间隔（秒）<input id="interval" type="number" min="0.5" step="0.5"></label><label>网络重试次数<input id="retry" type="number" min="1"></label><label>电话语音通知<select id="voice"><option value="0">关闭</option><option value="1">开启</option></select></label><label>邮件通知<select id="email"><option value="0">关闭</option><option value="1">开启</option></select></label></section><button class="toggle" id="toggle">显示高级配置</button><section class="advanced" id="advanced"><h2>高级配置</h2><div id="advanced-fields"></div></section><br><button id="save">检查并保存</button></main><script>
const H={Authorization:'Bearer '+(localStorage.user_token||''),'Content-Type':'application/json'};let cfg={};const $=id=>document.getElementById(id);const split=x=>(x||'').split(',').map(v=>v.trim()).filter(Boolean);function put(id,v){$(id).value=v==null?'':v}function get(id){return $(id).value}async function load(){let [c,s]=await Promise.all([fetch('/app/config',{headers:H}).then(r=>r.json()),fetch('/app/config/schema',{headers:H}).then(r=>r.json())]);cfg=c;let a=(c.USER_ACCOUNTS||[])[0]||{},j=(c.QUERY_JOBS||[])[0]||{},st=j.stations||{};put('user',a.user_name);put('pwd',a.password);put('login',a.type||'qr');put('left',st.left);put('arrive',st.arrive);put('dates',(j.left_dates||[]).join(','));put('members',(j.members||[]).join(','));put('seats',(j.seats||[]).join(','));put('trains',(j.train_numbers||[]).join(','));put('interval',c.QUERY_INTERVAL);put('retry',c.REQUEST_MAX_RETRY);put('voice',c.NOTIFICATION_BY_VOICE_CODE);put('email',c.EMAIL_ENABLED);$('advanced-fields').innerHTML=s.filter(x=>!['USER_ACCOUNTS','QUERY_JOBS','QUERY_INTERVAL','REQUEST_MAX_RETRY','NOTIFICATION_BY_VOICE_CODE','EMAIL_ENABLED'].includes(x.key)).map(x=>'<label>'+x.title+'<small>'+x.help+'</small><textarea data-k="'+x.key+'">'+JSON.stringify(c[x.key])+'</textarea></label>').join('');$('msg').textContent='配置已加载'}function payload(){let o=Object.assign({},cfg);o.USER_ACCOUNTS=[{key:0,user_name:get('user'),password:get('pwd'),type:get('login')}];o.QUERY_JOBS=[{account_key:0,left_dates:split(get('dates')),stations:{left:get('left'),arrive:get('arrive')},members:split(get('members')),seats:split(get('seats')),train_numbers:split(get('trains')),except_train_numbers:[],allow_less_member:0,period:{from:'00:00',to:'24:00'}}];o.QUERY_INTERVAL=parseFloat(get('interval'));o.REQUEST_MAX_RETRY=parseInt(get('retry'));o.NOTIFICATION_BY_VOICE_CODE=parseInt(get('voice'));o.EMAIL_ENABLED=parseInt(get('email'));document.querySelectorAll('[data-k]').forEach(x=>{try{o[x.dataset.k]=JSON.parse(x.value)}catch(e){o[x.dataset.k]=x.value}});return o}$('toggle').onclick=()=>{$('advanced').style.display=$('advanced').style.display==='block'?'none':'block';$('toggle').textContent=$('advanced').style.display==='block'?'隐藏高级配置':'显示高级配置'};$('save').onclick=async()=>{let o=payload();let v=await fetch('/app/config/validate',{method:'POST',headers:H,body:JSON.stringify(o)}).then(r=>r.json());if(!v.valid){$('msg').className='err';$('msg').textContent=v.errors.join('；');return}await fetch('/app/config',{method:'PUT',headers:H,body:JSON.stringify(o)});$('msg').className='ok';$('msg').textContent='已保存，配置已热加载'};load().catch(e=>$('msg').textContent='加载失败：'+e.message);
</script>
